name: Security

on:
  pull_request:
  push:
    branches: [main, develope]
  schedule:
    # Weekly, because a dependency that was clean at merge time can be
    # disclosed as vulnerable later without anyone touching the code.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails the build on high/critical advisories only: blocking on every low
      # advisory trains people to ignore the job.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and later removed is still exposed
          # in this repository, which is public.
          fetch-depth: 0

      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3
