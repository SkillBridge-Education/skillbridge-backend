name: Security

on:
  pull_request:
  push:
    branches: [main, staging, develop]
  schedule:
    # Weekly, because a dependency that was clean at merge time can be
    # disclosed as vulnerable later without anyone touching the code.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails the build on high/critical advisories only: blocking on every low
      # advisory trains people to ignore the job.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and later removed is still exposed
          # in this repository, which is public.
          fetch-depth: 0

      # Le binaire gitleaks, pas l'action GitHub : l'outil est libre (MIT),
      # mais l'action exige une licence payante des que le depot appartient a
      # une organisation. Elle echouait donc a chaque execution depuis que les
      # depots ont ete transferes -- sur le scan de secrets, precisement le job
      # qu'on ne veut jamais voir rouge par accident.
      - name: Scan history for committed secrets
        run: |
          VERSION=8.28.0
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSL "$URL" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3
