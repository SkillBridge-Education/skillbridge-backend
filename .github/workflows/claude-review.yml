name: Revue automatique

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Une seule revue en vol par PR : pousser trois commits d'affilee ne doit pas
# lancer trois revues qui se marchent dessus et coutent trois fois.
concurrency:
  group: revue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Sans cle, on ne fait pas echouer la PR : une revue absente est un
      # probleme de configuration, pas un defaut du code propose. Le message
      # dit quoi faire.
      - name: Verifier la cle
        id: cle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "presente=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret ANTHROPIC_API_KEY absent. Settings -> Secrets and variables -> Actions -> New repository secret. Revue ignoree."
          else
            echo "presente=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Revue
        if: steps.cle.outputs.presente == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Write"
          prompt: |
            Relis cette pull request sur skillbridge-backend (Express 5, TypeScript, Prisma 7, PostgreSQL, Socket.IO).

            Concentre-toi sur ce qui casse quelque chose, jamais sur le style :
            correction, securite, coherence avec l'architecture existante,
            et le fait que le code fasse reellement ce que son message annonce.

            Points d'attention propres a ce depot :

            - Toute route qui lit ou ecrit des donnees d'un membre doit exiger
              un jeton. Une route publique qui renvoie des profils est un
              annuaire de mineurs.
            - Une adhesion (organizationId) se lit depuis le compte appelant,
              jamais depuis le corps ou l'URL de la requete.
            - Les credits passent par grantCredits et spendCredits, jamais par
              un increment ou decrement brut : le plafond est une contrainte
              SQL, et la contourner fait echouer toute la transaction.
            - Une transition d'etat doit etre revendiquee dans la transaction
              qui la paie, sinon deux requetes concurrentes la reglent deux fois.
            - Tout ce qui vient du client passe par un schema zod. Les cles non
              declarees sont supprimees en silence : un champ ajoute au client
              sans etre ajoute au schema disparait sans erreur.

            Ce projet a un public de mineurs de 15 a 18 ans et des obligations
            RGPD et DSA. Traite comme BLOQUANT tout ce qui expose des donnees
            personnelles, contourne une verification d'age, ou rend une
            fonctionnalite de securite decorative.

            Classe chaque probleme trouve :

              BLOQUANT  le code est faux, dangereux, ou une fonctionnalite
                        annoncee ne marche pas
              MAJEUR    defaut reel a corriger, mais qui n'empeche pas de
                        fusionner
              MINEUR    remarque, amelioration possible

            Poste un commentaire en ligne par probleme concret, a l'endroit
            exact du code. Pas de commentaire generique, pas de resume de ce
            que fait la PR : l'auteur le sait deja.

            Un point de methode : une fonctionnalite peut etre entierement
            ecrite et testee cote service et n'etre montee sur aucune route.
            C'est arrive sur ce projet -- quatre actions du chat repondaient
            404 alors que leurs tests unitaires passaient. Quand une PR ajoute
            un service, verifie qu'une route l'expose reellement.

            Termine en ecrivant un fichier verdict.txt a la racine, contenant
            exactement une de ces deux lignes, et rien d'autre :

              MERGE_OK       aucun probleme bloquant
              MERGE_BLOQUE   au moins un probleme bloquant

      # C'est cette etape qui allume le bouton en rouge. GitHub ne lit pas les
      # commentaires : il regarde si le job a reussi. Sans elle, la revue
      # pourrait signaler n'importe quoi et le check resterait vert.
      - name: Verdict
        if: steps.cle.outputs.presente == 'true'
        run: |
          if [ ! -f verdict.txt ]; then
            echo "::warning::Aucun verdict rendu. Revue traitee comme non concluante."
            exit 0
          fi

          echo "Verdict : $(cat verdict.txt)"

          if grep -q "MERGE_BLOQUE" verdict.txt; then
            echo "::error::La revue a trouve au moins un probleme bloquant. Voir les commentaires en ligne sur la PR."
            exit 1
          fi

          echo "Aucun probleme bloquant."
